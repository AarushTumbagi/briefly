<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 500" role="img" aria-labelledby="flTitle">
  <title id="flTitle">How Briefly works: pick a lens, read a briefing, open stories in levels, facts are remembered, and return visits show only what is new.</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <rect x="70" y="14" width="300" height="62" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="220" y="40" font-size="16" font-weight="700" fill="#0f172a">1 · Pick a lens</text>
    <text x="220" y="60" font-size="12.5" fill="#475569">Global · Near me · AI</text>

    <line x1="220" y1="78" x2="220" y2="102" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="70" y="104" width="300" height="62" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="220" y="130" font-size="16" font-weight="700" fill="#0f172a">2 · Daily briefing</text>
    <text x="220" y="150" font-size="12.5" fill="#475569">One evolving card per story</text>

    <line x1="220" y1="168" x2="220" y2="192" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="70" y="194" width="300" height="62" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="220" y="220" font-size="16" font-weight="700" fill="#0f172a">3 · Read in levels</text>
    <text x="220" y="240" font-size="12.5" fill="#475569">Quick take, then reveal more on demand</text>

    <line x1="220" y1="258" x2="220" y2="282" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="70" y="284" width="300" height="62" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="220" y="310" font-size="16" font-weight="700" fill="#0f172a">4 · Facts remembered</text>
    <text x="220" y="330" font-size="12.5" fill="#475569">Seen vs new, stored on your device</text>

    <line x1="220" y1="348" x2="220" y2="372" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="70" y="374" width="300" height="62" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="220" y="400" font-size="16" font-weight="700" fill="#0f172a">5 · Come back later</text>
    <text x="220" y="420" font-size="12.5" fill="#475569">Only what&apos;s new is shown</text>

    <text x="220" y="470" font-size="13" fill="#64748b">Temporary lenses never overwrite your Interests.</text>
  </g>
</svg>
